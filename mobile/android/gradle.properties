# Keep Gradle within the available RAM on the verified 16 GB Windows host.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# Flutter plugins are cached on C: while this project lives on F:. Kotlin's
# incremental path cache cannot relativize sources across Windows drives.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
